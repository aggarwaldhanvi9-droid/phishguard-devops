---
- name: Run unit tests with pytest
  command: pytest -v
  args:
    chdir: "{{ project_root }}"

- name: Build Docker image
  command: docker build -t {{ image_name }}:{{ image_tag }} .
  args:
    chdir: "{{ project_root }}"
  notify: Restart PhishGuard Deployment

- name: Load Docker image into kind cluster
  command: kind load docker-image {{ image_name }}:{{ image_tag }} --name {{ cluster_name }}

- name: Apply Kubernetes ConfigMap, Deployment, and Service
  command: kubectl apply -f {{ project_root }}/k8s/
